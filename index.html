<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Definitely Maybe Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'IBM Plex Mono', monospace;
      background: transparent;
      color: #000;
      margin: 0;
      padding: 4rem 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 1600px;
      width: 100%;
    }
    h1 {
      font-weight: 600;
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    h3 {
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      text-align: left;
      background: #fff;
      padding: 1rem;
      border: 1px dashed #000;
      border-radius: 0.25rem;
    }
    .card {
      border: 1px dashed #000;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .question {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: translateY(2rem);
    }
    .question.active {
      display: block;
      transform: translateY(0);
      opacity: 1;
    }
    label {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0;
      font-size: 1.1rem;
      line-height: 1.8;
      width: 100%;
      max-width: 1400px;
      padding: 1rem;
      border: 1px dashed #000;
      border-radius: 0.5rem;
    }
    input[type="radio"] {
      width: 1.25rem;
      height: 1.25rem;
      margin: 0;
      flex-shrink: 0;
    }
    button, .continue-btn {
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      font: inherit;
      border: 1px solid #000;
      background: transparent;
      cursor: pointer;
    }
    button:hover {
      background: #000;
      color: #fff;
    }
    #startScreen {
      text-align: center;
      margin-top: 10vh;
    }
    .result, .explanation {
      margin-top: 2rem;
    }
    ul {
      padding-left: 1.25rem;
    }
    .correct-flash {
      animation: flash-green 0.5s ease-in-out;
    }
    @keyframes flash-green {
      0% { background-color: #d4fdd4; }
      100% { background-color: transparent; }
    }
    canvas.confetti {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
    }
    .progress-bar {
      height: 6px;
      width: 0;
      background: #000;
      transition: width 0.4s ease;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Definitely Maybe Quiz</h1>
    <p>Test your knowledge of Oasis' iconic debut album.</p>
    <button id="startButton">Start Quiz</button>
  </div>

  <div id="quizScreen" class="container" style="display:none;">
    <div class="progress-bar" id="progressBar"></div>
    <div id="progressText" style="font-family: 'IBM Plex Mono', monospace; font-size: 1rem; margin-bottom: 1rem; text-align: right;">Question 1 of 10</div>
    <div class="card">
      <form id="quizForm"></form>
      <div id="result" class="result"></div>
      <button type="button" onclick="nextQuestion()" id="nextBtn" disabled>Next</button>
      <div id="explanations" class="explanation"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    let currentQuestionIndex = 0;
    const quizForm = document.getElementById("quizForm");
    const explanations = document.getElementById("explanations");

    const questions = [
      { q: "Which track from the failed Monnow Valley sessions was the only one to make the final album?", options: ["Columbia", "Slide Away", "Shakermaker", "Bring It On Down"], answer: "Slide Away", explanation: "Only ‘Slide Away’ survived Dave Batchelor’s version, later remixed by Owen Morris." },
      { q: "What specific mixing technique did Owen Morris use on the drums to give the album its extra groove?", options: ["Gated reverb", "Double tracking", "Eighth-note tape delay", "Phase inversion"], answer: "Eighth-note tape delay", explanation: "Inspired by Phil Spector and Tony Visconti, this gave the drums a relentless, driving feel." },
      { q: "What did Liam Gallagher claim haunted the Monnow Valley studio during the first recording attempt?", options: ["The ghost of Elvis", "A poltergeist that only he could see", "A phantom dog", "A literal ghost"], answer: "A literal ghost", explanation: "Not a metaphor — he genuinely believed there was a ghost in the studio." },
      { q: "What household drink was used to fake wine in the album cover shoot?", options: ["Cranberry juice", "Cherryade", "Diluted Ribena", "Vimto"], answer: "Diluted Ribena", explanation: "Red wine photographs as black. Ribena gave it the right visual tone." },
      { q: "Why did the band ultimately hand over the tapes to Owen Morris with full control?", options: ["Noel quit the sessions", "They had no time left to re-record", "Marcus Russell told him: “Do whatever you want.”", "Creation had run out of money"], answer: "Marcus Russell told him: “Do whatever you want.”", explanation: "It was a desperate last move after two failed sessions and mounting costs." },
      { q: "What 2024 reissue first officially released the complete Monnow Valley sessions?", options: ["Chasing the Sun edition", "Stop the Clocks bonus disc", "30th Anniversary Edition", "Definitely Maybe: The Lost Tapes"], answer: "30th Anniversary Edition", explanation: "Finally let fans hear the original versions — plus Liam’s version of ‘Sad Song.’" },
      { q: "How did the iconic recording of “Supersonic” actually begin?", options: ["As a warm-up riff by Noel", "As a jam during a failed take of “I Will Believe”", "As an idea recorded at a soundcheck", "As a rewritten version of “Whatever”"], answer: "As a jam during a failed take of “I Will Believe”", explanation: "They were bored, jamming, and Tony Griffiths insisted they hit record." },
      { q: "Why was engineer Dave Scott fired during the Monnow Valley sessions?", options: ["He broke a Neve console", "He clashed with Liam over tempos", "He suggested a tempo change on “Slide Away” that worked", "He leaked the demos to the NME"], answer: "He suggested a tempo change on “Slide Away” that worked", explanation: "Batchelor wanted it slower. Scott's faster tempo worked — and got him canned." },
      { q: "What was unusual about the early demo version of “Columbia”?", options: ["It had reversed vocals", "It featured three spiritual samples, most of which were later cut", "It was performed entirely by Noel", "It was recorded live in one take"], answer: "It featured three spiritual samples, most of which were later cut", explanation: "Only one sample remained; the rest — including a Hare Krishna chant — were axed." },
      { q: "What was the main reason the final version of Definitely Maybe sounded louder than anything else on the radio or jukeboxes at the time?", options: ["Overdubbed crowd noise", "Varispeeded tape", "Owen Morris’s brickwall compression", "Mastering to vinyl first, then CD"], answer: "Owen Morris’s brickwall compression", explanation: "Deliberate, brutal loudness. Morris mastered it for maximum impact, not nuance." }
    ];

    document.getElementById("startButton").addEventListener("click", () => {
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("quizScreen").style.display = "block";
      updateProgressBar();
    });

    function nextQuestion() {
      const current = document.getElementById(`question-${currentQuestionIndex}`);
      const selected = document.querySelector(`input[name='q${currentQuestionIndex}']:checked`);
      if (!selected) return alert("Please select an answer before continuing.");

      const userAnswer = selected.value;
      const correctAnswer = questions[currentQuestionIndex].answer;

      if (userAnswer === correctAnswer) {
        current.classList.add("correct-flash");
        const rect = current.getBoundingClientRect();
        confetti({
          particleCount: 100,
          spread: 70,
          origin: {
            x: (rect.left + rect.width / 2) / window.innerWidth,
            y: (rect.top + rect.height / 2) / window.innerHeight
          }
        });
        setTimeout(() => current.classList.remove("correct-flash"), 500);
      }

      current.classList.remove("active");
      const resultDiv = document.getElementById("result");
      const explanation = questions[currentQuestionIndex].explanation || "";

      resultDiv.innerHTML = userAnswer === correctAnswer
        ? `<p><strong>Correct!</strong></p><p><strong>${explanation}</strong></p>`
        : `<p><strong>Incorrect.</strong> Correct answer: <strong>${correctAnswer}</strong></p><p><strong>${explanation}</strong></p>`;

      document.getElementById("nextBtn").style.display = "none";

      const contButton = document.createElement("button");
      contButton.className = "continue-btn";
      contButton.textContent = "Continue";
      contButton.onclick = showNext;
      resultDiv.appendChild(contButton);
    }

    function updateProgressBar() {
      const bar = document.getElementById("progressBar");
      const text = document.getElementById("progressText");
      const percent = ((currentQuestionIndex + 1) / questions.length) * 100;
      bar.style.width = percent + "%";
      text.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
    }

    function showNext() {
      document.getElementById("nextBtn").style.display = "inline-block";
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";

      const current = document.getElementById(`question-${currentQuestionIndex}`);
      current.style.display = "none";
      current.style.opacity = 0;

      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        const next = document.getElementById(`question-${currentQuestionIndex}`);
        next.classList.add("active");
        updateProgressBar();
      } else {
        checkAnswers();
      }
    }

    function checkAnswers() {
      let score = 0;
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        if (selected && selected.value === q.answer) score++;
      });

      quizForm.style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `<h3>You got ${score}/10</h3><p>${score === questions.length ? "You're a Rock 'n' Roll Star!" : "Better luck next time."}</p>`;

      if (score === questions.length) {
        setTimeout(() => {
          confetti({
            particleCount: 500,
            spread: 160,
            scalar: 1.4,
            origin: { y: 0.4 }
          });
        }, 600);

        const homeBtn = document.createElement("button");
        homeBtn.textContent = "Visit AudioEchoes.com";
        homeBtn.onclick = () => window.location.href = "https://www.audioechoes.com";
        resultDiv.appendChild(homeBtn);
      }

      explanations.innerHTML = "";
    }

    questions.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "question";
      if (index === 0) div.classList.add("active");
      div.id = `question-${index}`;
      div.innerHTML = `<h3>${index + 1}. ${item.q}</h3>`;

      item.options.forEach(opt => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${index}`;
        input.value = opt;
        input.required = true;
        input.addEventListener("change", () => {
          if (index === currentQuestionIndex) {
            document.getElementById("nextBtn").disabled = false;
          }
        });
        label.appendChild(input);
        label.append(` ${opt}`);
        div.appendChild(label);
      });

      quizForm.appendChild(div);
    });
  </script>
</body>
</html>
