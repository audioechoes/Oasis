<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Definitely Maybe Quiz – Wireframe Jank Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1rem;
      background: transparent;
      color: #000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 100%;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      padding: 1rem;
    }

    h1 {
      font-weight: 600;
      text-align: center;
      font-size: 1.4rem;
      margin: 0.5rem 0;
    }

    h3 {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      padding: 0.5rem;
      border: 1px dashed #000;
      border-radius: 0;
    }

    .card {
      border: 1px dashed #000;
      padding: 1rem;
      max-height: 500px;
      overflow-y: auto;
      border-radius: 0;
    }

    .question {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .question.active {
      display: block;
      opacity: 1;
    }

    label {
      display: block;
      margin: 0.5rem 0;
      padding: 0.5rem;
      border: 1px dashed #000;
      border-radius: 0;
    }

    input[type="radio"] {
      margin-right: 1rem;
    }

    button, .continue-btn {
      margin-top: 1rem;
      padding: 0.4rem 0.8rem;
      font-size: 1rem;
      border: 1px solid #000;
      background: transparent;
      cursor: pointer;
      border-radius: 0;
    }

    button:hover {
      background: #000;
      color: #fff;
    }

    #startScreen {
      text-align: center;
      margin-top: 1rem;
    }

    .result, .explanation {
      margin-top: 1rem;
    }

    /* Janky Animations */
    .correct-jank {
      animation: sketchyFlash 0.4s linear;
    }

    .wrong-shake {
      animation: headShake 0.5s ease-in-out;
    }

    @keyframes sketchyFlash {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-2px, 2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes headShake {
      0%   { transform: translateX(0); }
      15%  { transform: translateX(-5px); }
      30%  { transform: translateX(5px); }
      45%  { transform: translateX(-5px); }
      60%  { transform: translateX(5px); }
      75%  { transform: translateX(-3px); }
      90%  { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.2rem;
      }
      h3 {
        font-size: 1rem;
      }
      label {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="startScreen">
      <h1>Definitely Maybe Quiz</h1>
      <p>Test your knowledge of Oasis</p>
      <button id="startButton">Start Quiz</button>
    </div>

    <div id="quizScreen" style="display:none;">
      <div class="card">
        <form id="quizForm"></form>
        <div id="result" class="result"></div>
        <button type="button" onclick="nextQuestion()" id="nextBtn" disabled>Next</button>
        <div id="explanations" class="explanation"></div>
      </div>
    </div>
  </div>

  <script>
    let currentQuestionIndex = 0;
    const quizForm = document.getElementById("quizForm");
    const explanations = document.getElementById("explanations");

    const questions = [
      {
        q: "Where did the name \"Oasis\" come from?",
        options: ["A Beatles lyric", "A Manchester nightclub", "An Inspiral Carpets tour poster", "Liam’s favourite book"],
        answer: "An Inspiral Carpets tour poster",
        explanation: "The poster featured ‘Oasis Leisure Centre’ — Noel was a roadie for the band."
      },
      {
        q: "When and where was Oasis's first gig?",
        options: ["April 1992 at King Tut’s Wah Wah Hut", "August 1991 at The Boardwalk, Manchester", "May 1993 at The Haçienda", "September 1990 at The Cavern Club"],
        answer: "August 1991 at The Boardwalk, Manchester",
        explanation: "It was their first performance as a full lineup with Liam."
      },
      {
        q: "How did Alan McGee discover Oasis?",
        options: ["Through their demo sent by post", "At Glastonbury Festival", "At a gig they weren’t originally booked to play", "After a recommendation from Tony Wilson"],
        answer: "At a gig they weren’t originally booked to play",
        explanation: "They forced their way onto the bill at King Tut’s in Glasgow."
      },
      {
        q: "What was Oasis’s first UK Top 10 single?",
        options: ["“Supersonic”", "“Shakermaker”", "“Cigarettes & Alcohol”", "“Live Forever”"],
        answer: "“Live Forever”",
        explanation: "It reached number 10 and was their first major chart breakthrough."
      },
      {
        q: "What happened in the 1995 \"Battle of Britpop\"?",
        options: ["Oasis refused to chart", "Blur’s single outsold Oasis’s", "Oasis beat Blur to number one", "Both bands released albums on the same day"],
        answer: "Blur’s single outsold Oasis’s",
        explanation: "Blur’s “Country House” beat Oasis’s “Roll With It” in sales that week."
      },
      {
        q: "How many people did Oasis play to across two nights at Knebworth in 1996?",
        options: ["100,000", "150,000", "250,000", "500,000"],
        answer: "250,000",
        explanation: "Over 2.5 million applied for tickets — a record at the time."
      },
      {
        q: "Why did Liam Gallagher not sing at the MTV Unplugged performance in 1996?",
        options: ["He lost his voice due to illness", "He was angry at Noel", "He cited a sore throat and watched from the balcony", "He was stuck in traffic"],
        answer: "He cited a sore throat and watched from the balcony",
        explanation: "Noel performed vocals; Liam heckled from above."
      },
      {
        q: "What UK record did Be Here Now set upon release?",
        options: ["Longest album", "Most chart weeks at number one", "Most expensive production", "Fastest-selling British album at the time"],
        answer: "Fastest-selling British album at the time",
        explanation: "It sold over 420,000 copies in a single day in the UK."
      },
      {
        q: "Where was Be Here Now recorded?",
        options: ["Rockfield Studios only", "Sawmills and Abbey Road", "Abbey Road and Ridge Farm Studios", "Real World Studios"],
        answer: "Abbey Road and Ridge Farm Studios",
        explanation: "It was recorded across iconic studios during an intense period."
      },
      {
        q: "Who replaced Bonehead and Guigsy in 1999?",
        options: ["Richard Ashcroft and Mani", "Alan White and Andy Rourke", "Gem Archer and Andy Bell", "Steve White and John Power"],
        answer: "Gem Archer and Andy Bell",
        explanation: "They joined for the 'Standing on the Shoulder of Giants' sessions."
      }
    ];

    document.getElementById("startButton").addEventListener("click", () => {
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("quizScreen").style.display = "block";
    });

    function nextQuestion() {
      const current = document.getElementById(`question-${currentQuestionIndex}`);
      const selected = document.querySelector(`input[name='q${currentQuestionIndex}']:checked`);
      if (!selected) return alert("Please select an answer before continuing.");

      const userAnswer = selected.value;
      const correctAnswer = questions[currentQuestionIndex].answer;

      // Add jank class
      const animationClass = userAnswer === correctAnswer ? "correct-jank" : "wrong-shake";
      current.classList.add(animationClass);
      setTimeout(() => current.classList.remove(animationClass), 500);

      current.classList.remove("active");
      const resultDiv = document.getElementById("result");
      const explanation = questions[currentQuestionIndex].explanation || "";

      resultDiv.innerHTML = userAnswer === correctAnswer
        ? `<p><strong>Correct!</strong></p><p>${explanation}</p>`
        : `<p><strong>Incorrect.</strong> Correct answer: <strong>${correctAnswer}</strong></p><p>${explanation}</p>`;

      document.getElementById("nextBtn").style.display = "none";

      const contButton = document.createElement("button");
      contButton.className = "continue-btn";
      contButton.textContent = "Continue";
      contButton.onclick = showNext;
      resultDiv.appendChild(contButton);
    }

    function showNext() {
      document.getElementById("nextBtn").style.display = "inline-block";
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";

      const current = document.getElementById(`question-${currentQuestionIndex}`);
      current.style.display = "none";
      current.style.opacity = 0;

      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        const next = document.getElementById(`question-${currentQuestionIndex}`);
        next.classList.add("active");
      } else {
        checkAnswers();
      }
    }

    function checkAnswers() {
      let score = 0;
      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name='q${i}']:checked`);
        if (selected && selected.value === q.answer) score++;
      });

      quizForm.style.display = "none";
      document.getElementById("nextBtn").style.display = "none";

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = `<h3>You got ${score}/10</h3><p>${score === questions.length ? "You're a Rock 'n' Roll Star!" : "Better luck next time."}</p>`;
      explanations.innerHTML = "";
    }

    questions.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "question";
      if (index === 0) div.classList.add("active");
      div.id = `question-${index}`;
      div.innerHTML = `<h3>${index + 1}. ${item.q}</h3>`;

      item.options.forEach(opt => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${index}`;
        input.value = opt;
        input.required = true;
        input.addEventListener("change", () => {
          if (index === currentQuestionIndex) {
            document.getElementById("nextBtn").disabled = false;
          }
        });
        label.appendChild(input);
        label.append(` ${opt}`);
        div.appendChild(label);
      });

      quizForm.appendChild(div);
    });
  </script>
</body>
</html>
